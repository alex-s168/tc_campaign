name: Zip and Publish

on:
  push

jobs:
  zip-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip matching directories
        run: |
          for dir in etca_* noc_*; do
            if [ -d "$dir" ]; then
              zip -r "${dir}.zip" "$dir"
            fi
          done

      - name: Upload zipped directories
        uses: actions/upload-artifact@v4
        with:
          name: zipped-directories
          path: "*.zip"
          retention-days: 7

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
